<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FelixCode</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.fcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.fcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: transparent;
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .startup-logo {
        width: 96px;
        height: 96px;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <div class="startup-logo-shell">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 512 512"
          class="startup-logo"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="startup-background" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#152B43" />
              <stop offset="1" stop-color="#131A34" />
            </linearGradient>
            <linearGradient id="startup-symbol" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#42E5CC" />
              <stop offset="0.55" stop-color="#53B9F5" />
              <stop offset="1" stop-color="#8586F6" />
            </linearGradient>
          </defs>
          <rect
            x="24"
            y="24"
            width="464"
            height="464"
            rx="108"
            fill="url(#startup-background)"
            stroke="#3C6780"
            stroke-opacity="0.75"
            stroke-width="4"
          />
          <path
            d="M162 368 V166 Q162 147 181 147 H370"
            fill="none"
            stroke="url(#startup-symbol)"
            stroke-width="43"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M162 260 H302"
            fill="none"
            stroke="url(#startup-symbol)"
            stroke-width="43"
            stroke-linecap="round"
          />
          <circle cx="370" cy="147" r="22" fill="#72E7D1" />
          <circle cx="302" cy="260" r="22" fill="#7D9FF7" />
          <path
            d="M343 328 L357 359 L388 373 L357 387 L343 418 L329 387 L298 373 L329 359 Z"
            fill="#77B8F8"
          />
        </svg>
      </div>
    </div>
    <script type="module">
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("fcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("fcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("fcode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
